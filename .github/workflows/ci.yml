name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions:
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  determine-image-tag:
    name: Determine Image Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the full history to get the tag
          fetch-tags: true

      - name: Determine tag
        id: get-tag
        run: |
          UPSTREAM_URL=$(git remote get-url upstream 2>/dev/null || echo "https://github.com/x-heep/x-heep.git")
          git fetch --tags "$UPSTREAM_URL"
          TAG_NAME=$(git describe --tags --abbrev=0 --match "v*" 2> /dev/null || echo "")
          if [ -z "$TAG_NAME" ]; then
            echo "No tag in branch history, getting latest tag from main"
            TAG_NAME=$(git describe --tags --abbrev=0 --match "v*" origin/main 2> /dev/null || echo "")
          fi
          if [ -z "$TAG_NAME" ]; then
            echo "No tags found, defaulting to 'latest'"
            TAG_NAME="latest"
          fi
          echo "Detected tag: $TAG_NAME"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

  generate-app-matrix:
    name: Generate App Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate test matrix
        id: generate-matrix
        run: |
          python3 .github/scripts/generate_test_matrix.py > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  # 1. BUILD SIMULATOR (HW)
  build-simulator:
    name: Build Verilator
    runs-on: ubuntu-latest
    needs: [determine-image-tag, generate-app-matrix, lint, gen-peripherals, gen-pads, check-vendor, black-formatter]
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Build Binary
        shell: bash -l {0}
        run: |
          make mcu-gen X_HEEP_CFG=configs/ci.hjson
          # Explicitly build the binary
          make verilator-build
      - uses: actions/upload-artifact@v4
        with:
          name: verilator-sim-${{ github.run_id }}
          path: build/
          retention-days: 1
          if-no-files-found: error

  # 2. COMPILE APPS (SW)
  compile-apps:
    name: Compile all Apps
    runs-on: ubuntu-latest
    needs: [determine-image-tag, generate-app-matrix, lint, gen-peripherals, gen-pads, check-vendor, black-formatter]
    strategy:
      fail-fast: false
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Compile Only
        shell: bash -l {0}
        run: |
          make mcu-gen X_HEEP_CFG=configs/ci.hjson
          # Compiles to sw/build/ directory
          python3 test/test_apps/test_apps.py --compilers gcc --compile-only

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-apps-${{ github.run_id }}
          path: sw/build/
          retention-days: 1
          if-no-files-found: error

  # 3. RUN SIMULATION (Distributed)
  simulate-apps:
    name: Simulate (Batch ${{ matrix.batch }})
    runs-on: ubuntu-latest
    needs: [determine-image-tag, generate-app-matrix, build-simulator, compile-apps, lint, gen-peripherals, gen-pads, check-vendor, black-formatter]
    strategy:
      matrix: ${{ fromJson(needs.generate-app-matrix.outputs.matrix) }}
      fail-fast: false
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      # Download simulator build
      - uses: actions/download-artifact@v4
        with:
          name: verilator-sim-${{ github.run_id }}
          path: build/

      # Download compiled apps
      - uses: actions/download-artifact@v4
        with:
          name: compiled-apps-${{ github.run_id }}
          path: sw/build/

      - name: Verify artifacts
        shell: bash -l {0}
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Simulator build ==="
          ls -lh build/openhwgroup.org_systems_core-v-mini-mcu_*/sim-verilator/ 2>/dev/null || echo "Simulator directory not found"
          echo "=== Compiled apps ==="
          ls -lh sw/build/*.hex 2>/dev/null || ls -lh sw/build/ || echo "Apps not found"
          echo "=== Checking hardcoded paths ==="
          grep "^/" build/*/sim-verilator/*.vc 2>/dev/null | head -3 || echo "No absolute paths found"

      - name: Run Simulation
        shell: bash -l {0}
        run: |
          # Regenerate MCU config (needed for headers/linker scripts)
          make mcu-gen X_HEEP_CFG=configs/ci.hjson

          # Run simulations - simulator and apps already built/compiled!
          python3 test/test_apps/test_apps.py \
            --apps "${{ matrix.apps }}" \
            --run-only \
            --table

  lint:
    name: Lint Generated Files
    runs-on: ubuntu-latest
    needs: determine-image-tag
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Mark Repository as Safe
        run: |
          git config --global --add safe.directory /__w/x-heep/x-heep
      - name: Check generated file consistency
        shell: bash -l {0}
        run: |
          make mcu-gen && \
          util/git-diff.py --error-msg '::error ::Found differences in generated SystemVerilog files.'

  gen-peripherals:
    name: Test Peripherals Generation
    runs-on: ubuntu-latest
    needs: determine-image-tag
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Configure the job container and simulate all apps
        shell: bash -l {0}
        run: |
          make clean-all
          # Run the test script
          python3 test/test_x_heep_gen/test_peripherals.py

  gen-pads:
    name: Test Pad Generation
    runs-on: ubuntu-latest
    needs: determine-image-tag
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Configure the job container and simulate all apps
        shell: bash -l {0}
        run: |
          make clean-all
          # Run the test script
          make test_kwargs

  check-vendor:
    name: Vendor up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: Install requirements
        run: pip install -r util/python-requirements.txt
      - name: Re-vendor and diff
        run: |
          find . -name '*.vendor.hjson' | xargs -n1 util/vendor.py --verbose &&
          util/git-diff.py --error-msg '::error ::Found differences, please re-vendor.'

  black-formatter:
    name: Check Python code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: >
            util/x_heep_gen
            util/periph_structs_gen
            util/mcu_gen.py
            util/waiver-gen.py
            util/c_gen.py
            test/test_x_heep_gen
          version: "~= 24.8.0"
