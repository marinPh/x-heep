name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions:
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Artifact retention (can be used in steps context)
  ARTIFACT_RETENTION_DAYS: 1

  # Note: Job timeouts and matrix values must be hard-coded below
  # due to GitHub Actions limitations (env not available in job-level contexts)

jobs:
  determine-image-tag:
    name: Determine Image Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the full history to get the tag
          fetch-tags: true

      - name: Determine tag
        id: get-tag
        run: |
          UPSTREAM_URL=$(git remote get-url upstream 2>/dev/null || echo "https://github.com/x-heep/x-heep.git")
          git fetch --tags "$UPSTREAM_URL"
          TAG_NAME=$(git describe --tags --abbrev=0 --match "v*" 2> /dev/null || echo "")
          if [ -z "$TAG_NAME" ]; then
            echo "No tag in branch history, getting latest tag from main"
            TAG_NAME=$(git describe --tags --abbrev=0 --match "v*" origin/main 2> /dev/null || echo "")
          fi
          if [ -z "$TAG_NAME" ]; then
            echo "No tags found, defaulting to 'latest'"
            TAG_NAME="latest"
          fi
          echo "Detected tag: $TAG_NAME"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

  generate-app-matrix:
    name: Generate App Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate test matrix
        id: generate-matrix
        run: |
          python3 .github/scripts/generate_test_matrix.py > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build-simulator:
    name: Build ${{ matrix.simulator }}
    runs-on: ubuntu-latest
    needs: [determine-image-tag, generate-app-matrix, lint, gen-peripherals, gen-pads, check-vendor, black-formatter]
    strategy:
      fail-fast: false
      matrix:
        # To add more simulators: ["verilator", "questasim", "vcs", "xcelium"]
        simulator: ["verilator"]

    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project

      - name: Build ${{ matrix.simulator }}
        shell: bash -l {0}
        run: |
          make mcu-gen X_HEEP_CFG=configs/ci.hjson
          # Build the simulator
          make ${{ matrix.simulator }}-build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.simulator }}-sim-${{ github.run_id }}
          path: build/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error


  compile-apps:
    name: Compile all Apps
    runs-on: ubuntu-latest
    needs: [determine-image-tag, lint, gen-peripherals, gen-pads, check-vendor, black-formatter]
    strategy:
      fail-fast: false
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Compile Only
        shell: bash -l {0}
        run: |
          make mcu-gen X_HEEP_CFG=configs/ci.hjson
          # Compiles to sw/build/ directory
          python3 test/test_apps/test_apps.py --compilers gcc,clang,gcc --compiler-paths /tools/riscv --compiler-prefixes riscv32-corev-,riscv32-unknown-,riscv32-unknown- --table --compile-only --compile-only


  
  simulate-apps:
    name: Simulate (${{ matrix.simulator }}, Batch ${{ matrix.batch }})
    runs-on: ubuntu-latest
    needs: [determine-image-tag, generate-app-matrix, build-simulator, compile-apps, lint, gen-peripherals, gen-pads, check-vendor, black-formatter]
    strategy:
      fail-fast: false
      matrix:
        # Matrix generated by generate_test_matrix.py (includes simulator dimension)
        include: ${{ fromJson(needs.generate-app-matrix.outputs.matrix).include }}

    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Compile and simulate all apps
      # Download simulator build
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.simulator }}-sim-${{ github.run_id }}
          path: build/

      # Restore executable permissions (artifacts don't preserve them)
      - name: Restore executable permissions
        shell: bash -l {0}
        run: |
          echo "=== Restoring executable permissions for ${{ matrix.simulator }} ==="
          chmod +x build/*/sim-${{ matrix.simulator }}/Vtestharness
          ls -lh build/*/sim-${{ matrix.simulator }}/Vtestharness

      - name: Verify artifacts
        shell: bash -l {0}
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Simulator build ==="
          ls -lh build/openhwgroup.org_systems_core-v-mini-mcu_*/sim-${{ matrix.simulator }}/ 2>/dev/null || echo "Simulator directory not found"
          echo "=== Verifying ${{ matrix.simulator }} simulator binary ==="
          # Use glob expansion instead of find (more portable)
          SIM_BIN=$(ls build/*/sim-${{ matrix.simulator }}/Vtestharness 2>/dev/null | head -1)
          if [ -n "$SIM_BIN" ] && [ -f "$SIM_BIN" ]; then
            ls -lh "$SIM_BIN"
            echo "✓ Simulator binary found: $SIM_BIN"
            if [ ! -x "$SIM_BIN" ]; then
              echo "ERROR: Simulator binary is not executable!"
              echo "This means GitHub Actions artifact didn't preserve permissions."
              exit 1
            fi
            echo "✓ Simulator binary is executable"
          else
            echo "ERROR: Simulator binary (Vtestharness) not found in artifact!"
            echo "Expected location: build/openhwgroup.org_systems_core-v-mini-mcu_*/sim-${{ matrix.simulator }}/Vtestharness"
            ls -R build/ || true
            exit 1
          fi

      - name: Run Simulation
        shell: bash -l {0}
        run: |
          # Regenerate MCU config (needed for headers/linker scripts)
          make mcu-gen X_HEEP_CFG=configs/ci.hjson

          # Compile and run simulations for this batch (simulator already built)
          make mcu-gen X_HEEP_CFG=configs/ci.hjson && \
          python3 test/test_apps/test_apps.py --apps "${{ matrix.apps }}" \
            --skip-build-sim \
            --compilers gcc \
            --compiler-paths /tools/riscv \ 
            --compiler-prefixes riscv32-corev- --table


          # Add results to GitHub job summary
          echo "## Simulation Results: ${{ matrix.simulator }} (Batch ${{ matrix.batch }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint Generated Files
    runs-on: ubuntu-latest
    needs: determine-image-tag
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Mark Repository as Safe
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Check generated file consistency
        shell: bash -l {0}
        run: |
          make mcu-gen && \
          util/git-diff.py --error-msg '::error ::Found differences in generated SystemVerilog files.'

  gen-peripherals:
    name: Test Peripherals Generation
    runs-on: ubuntu-latest
    needs: determine-image-tag
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Configure the job container and simulate all apps
        shell: bash -l {0}
        run: |
          make clean-all
          # Run the test script
          python3 test/test_x_heep_gen/test_peripherals.py

  gen-pads:
    name: Test Pad Generation
    runs-on: ubuntu-latest
    needs: determine-image-tag
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.determine-image-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Configure the job container and simulate all apps
        shell: bash -l {0}
        run: |
          make clean-all
          # Run the test script
          make test_kwargs

  check-vendor:
    name: Vendor up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: Install requirements
        run: pip install -r util/python-requirements.txt
      - name: Re-vendor and diff
        run: |
          find . -name '*.vendor.hjson' | xargs -n1 util/vendor.py --verbose &&
          util/git-diff.py --error-msg '::error ::Found differences, please re-vendor.'

  black-formatter:
    name: Check Python code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: >
            util/x_heep_gen
            util/periph_structs_gen
            util/mcu_gen.py
            util/waiver-gen.py
            util/c_gen.py
            test/test_x_heep_gen
          version: "~= 24.8.0"
