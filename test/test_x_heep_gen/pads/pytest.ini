[pytest]
# Pytest configuration for x_heep_gen tests

# Minimum version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Show extra test summary info
    -ra
    # Strict markers - all markers must be defined
    --strict-markers
    # Show local variables in tracebacks
    --showlocals
    # Verbose output by default
    -v

# Test markers - define custom markers here
markers =
    integration: Integration tests that run mcu-gen with different configurations
    unit: Unit tests for individual components
    slow: Tests that take longer to run
    golden: Tests that compare against golden reference files

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
# [pytest-cov]
# addopts = --cov=util/x_heep_gen --cov-report=html --cov-report=term-missing

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Parallel execution (requires pytest-xdist)
# addopts = -n auto
